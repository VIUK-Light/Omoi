<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Omoi｜重い話までできる質問カード</title>
  <desc id="description">違う考えを知るために。白い背景に明朝体の文字と、質問カードを表す図形。</desc>
  <rect width="1200" height="630" fill="#faf9f6"/>
  <g fill="#ffffff" stroke="#e8e5df" stroke-width="1.5">
    <rect x="963" y="-118" width="330" height="370" rx="20" transform="rotate(22 1128 67)"/>
    <rect x="833" y="472" width="330" height="370" rx="20" transform="rotate(-28 998 657)"/>
  </g>
  <g fill="#181816" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-weight="400">
    <text x="80" y="178" font-family="'Times New Roman', Times, serif" font-size="86">Omoi</text>
    <text x="80" y="316" font-size="68">重い話までできる質問カード</text>
    <path d="M 84 367 H 212" stroke="#181816" stroke-width="3"/>
    <text x="82" y="447" font-size="38" letter-spacing="3">違う考えを知るために。</text>
  </g>
</svg>
