name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for file in *.js tools/*.mjs; do
            node --check "$file"
          done
      - name: Question flow regression tests
        run: node --test tools/*.test.mjs
      - name: Question dataset
        run: node tools/verify-question-dataset.mjs --enforce-quality-targets --summary
      - name: SEO
        run: node tools/verify-seo.mjs
