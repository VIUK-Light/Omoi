<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>質問 - Omoi</title>
</head>

<body>
    <main>
        <a href="select.html" class="back-link">
            ← レベル選択へ戻る
        </a>

        <p id="levelDisplay"></p>

        <h1 id="questionText">
            読み込み中...
        </h1>

        <button type="button" id="detailButton" hidden>
            この問いを知る
        </button>

        <div id="detailPanel" hidden>
            <p id="detailText"></p>

            <div id="sourceSection">
                <h2>出典</h2>
                <ul id="sourceList"></ul>
            </div>

            <p>
                この解説には、異なる見解や不確実性が
                含まれる場合があります。
            </p>

            <button type="button" id="closeDetailButton">
                閉じる
            </button>
        </div>

        <button type="button" id="skipQuestionButton">
            今回は話さない
        </button>

        <button type="button" id="nextQuestionButton">
            次の質問
        </button>
    </main>

    <script src="question.js"></script>
</body>
</html>
