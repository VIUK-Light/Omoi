<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">

    <title>問いの選び方 - Omoi</title>
    <link rel="stylesheet" href="select.css">
    <script src="theme.js"></script>
    <script src="progress.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <main class="select-screen">
        <div class="select-content">

            <h1 id="modeHeading">どんな話をしたい？</h1>

            <aside id="resumeNotice" class="resume-notice" aria-label="前回の続き" hidden>
                <p class="resume-notice-text">
                    <strong>前回の続きがあります</strong>
                    <span id="resumeNoticeDetail"></span>
                </p>
                <a id="resumeNoticeLink" class="resume-notice-link" href="select.html">
                    続きから話す
                </a>
                <button
                    type="button"
                    id="resumeNoticeClose"
                    class="resume-notice-close"
                    aria-label="前回の続きのお知らせを閉じる"
                >×</button>
            </aside>

            <div class="mode-list" role="radiogroup" aria-labelledby="modeHeading">

                <input type="radio" name="mode" id="modeStudent" value="student">
                <label for="modeStudent" class="mode-card">
                    <div>
                        <span class="mode-name">student</span>
                        <strong>学校・若者向け</strong>
                        <small>いじめ、友人関係、家族、SNSなどから選べます</small>
                    </div>
                    <span class="radio-mark"></span>
                </label>

                <input type="radio" name="mode" id="modeAll" value="all">
                <label for="modeAll" class="mode-card">
                    <div>
                        <span class="mode-name">all</span>
                        <strong>すべてから選ぶ</strong>
                        <small>次の画面で話の深さ（level）を選びます</small>
                    </div>
                    <span class="radio-mark"></span>
                </label>

                <input type="radio" name="mode" id="modeCustom" value="custom">
                <label for="modeCustom" class="mode-card">
                    <div>
                        <span class="mode-name">custom</span>
                        <strong>自分で選ぶ</strong>
                        <small>次の画面でカテゴリーと問いを組み合わせます</small>
                    </div>
                    <span class="radio-mark"></span>
                </label>

            </div>

            <div class="select-actions">
                <a href="index.html" class="back-link">
                    ← 戻る
                </a>

                <button type="button" id="nextButton" disabled>
                    次へ
                </button>
            </div>

        </div>
    </main>

    <script src="select.js"></script>
</body>
</html>
