<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>使い方 - Omoi</title>

    <link rel="stylesheet" href="style-with-howto.css">
</head>

<body>
    <main class="howto-screen">
        <a href="index.html" class="howto-back">
            ← 戻る
        </a>

        <section class="howto-content">
            <p class="howto-label">Omoi</p>
            <h1>使い方</h1>

            <div class="howto-list">
                <section class="howto-item">
                    <span class="howto-number">1</span>
                    <div>
                        <h2>深さを選ぶ</h2>
                        <p>Level 1〜4から選びます。</p>
                    </div>
                </section>

                <section class="howto-item">
                    <span class="howto-number">2</span>
                    <div>
                        <h2>質問について話す</h2>
                        <p>「なぜそう思う？」まで話してみてください。</p>
                    </div>
                </section>

                <section class="howto-item">
                    <span class="howto-number">3</span>
                    <div>
                        <h2>必要なら背景を見る</h2>
                        <p>
                            「この問いを知る」から、
                            背景や異なる考え方を確認できます。
                        </p>
                    </div>
                </section>

                <section class="howto-item">
                    <span class="howto-number">4</span>
                    <div>
                        <h2>話したくなければ飛ばす</h2>
                        <p>
                            「今回は話さない」をいつでも選べます。
                        </p>
                    </div>
                </section>
            </div>
        </section>
    </main>
</body>
</html>
